services:
  postgres:
    image: postgres:16-alpine
    container_name: rfq_auction_db
    environment:
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq
      POSTGRES_DB: rfq_auction
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - rfq_pgdata:/var/lib/postgresql/data
volumes:
  rfq_pgdata:
