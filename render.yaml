# Render Blueprint: one web service (Express API + built React app) and a Postgres database.
databases:
  - name: british-auction-rfq-db
    plan: free
    region: singapore
    databaseName: rfq_auction
    user: rfq

services:
  - type: web
    name: british-auction-rfq
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: british-auction-rfq-db
          property: connectionString
